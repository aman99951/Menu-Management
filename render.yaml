databases:
  - name: menudb
    databaseName: menudb
    user: menudb_user
    plan: free

services:
  # ------------ Backend (NestJS) ------------
  - type: web
    name: backend
    runtime: node
    plan: free
    buildCommand: |
      npm ci
      npm --prefix apps/backend run prisma generate
      npm --prefix apps/backend run build
    startCommand: |
      npm --prefix apps/backend run db:push && \
      npm --prefix apps/backend run start
    healthCheckPath: /menus
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: menudb
          property: connectionString
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: https://frontend.onrender.com   # update after first deploy
      - key: NODE_VERSION
        value: "20"

  # ------------ Frontend (Next.js App Router) ------------
  - type: web
    name: frontend
    runtime: node
    plan: free
    buildCommand: |
      npm ci
      npm --prefix apps/frontend run build
    startCommand: |
      PORT=${PORT:-3000} npm --prefix apps/frontend run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://backend.onrender.com   # update after first deploy
      - key: NODE_VERSION
        value: "20"
